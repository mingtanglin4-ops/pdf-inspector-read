name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          # Oldest and newest supported interpreters, on the cheapest runner.
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.13"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # Deliberately NOT installed on macOS or Windows: poppler is absent on a
      # default install there, and the suite must prove the skill degrades
      # honestly rather than blaming poppler for being missing.
      - name: Install poppler (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Run tests
        run: python -m pytest

      - name: Smoke-test the CLI end to end
        shell: bash
        run: |
          python - <<'PY'
          from reportlab.pdfgen import canvas
          c = canvas.Canvas("smoke.pdf")
          c.setFont("Helvetica", 12)
          c.drawString(60, 760, "Smoke test document with enough words to be real text.")
          c.save()
          PY
          python scripts/pdfread.py smoke.pdf --json --detect-only
          python scripts/render_pages.py smoke.pdf --out artifacts

      - name: Token benchmark (small, just to keep it runnable)
        run: python bench/token_economics.py --pages 4 --sweep
